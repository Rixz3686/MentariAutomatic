<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Mentari Mod — Playground</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      #world {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(
          to bottom,
          #82d4ff 0%,
          #d9f5ff 55%,
          #c9e9a5 55%,
          #91c96d 100%
        );
        transition: background 1.8s cubic-bezier(0.65, 0, 0.35, 1);
      }
      #world.night {
        background: linear-gradient(
          to bottom,
          #070512 0%,
          #130b2e 40%,
          #2b1463 62%,
          #161435 100%
        );
      }
      .controls {
        position: absolute;
        right: 20px;
        bottom: 20px;
        z-index: 100;
      }
      .controls button {
        border: 0;
        padding: 10px 14px;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.7);
        color: #30452c;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition:
          transform 0.2s ease,
          background 0.3s ease,
          color 0.3s ease;
      }
      .controls button:hover {
        transform: translateY(-2px);
        background: white;
      }
      #world.night button {
        background: rgba(91, 33, 182, 0.78);
        color: #ede9fe;
        border: 1px solid rgba(167, 139, 250, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="world">
      <div class="controls">
        <button id="nightButton" type="button">🌙 Malam</button>
      </div>
    </div>

    <script src="pet.js"></script>
  </body>
</html>
